
apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate

metadata:
  name: hello20-serving
  annotations:
    scenarios.ai.sap.com/description: "Introduction to SAP AI Core"
    scenarios.ai.sap.com/name: "helloscenrio20"
    executables.ai.sap.com/description: "Hello World HTTP serving API"
    executables.ai.sap.com/name: "Hello RCnov19 Serving"
  labels:
    scenarios.ai.sap.com/id: "helloscenrio20"
    ai.sap.com/version: "1.1"

spec:
  template:
    apiVersion: serving.kserve.io/v1beta1
    metadata:
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: docker.io/python:3.11-slim
            ports:
              - containerPort: 9001
                protocol: TCP
            command:
              - python3
              - "-u"
              - "-c"
            args:
              - |
                from http.server import HTTPServer, BaseHTTPRequestHandler
                import json

                class Handler(BaseHTTPRequestHandler):
                    def do_GET(self):
                        if self.path == "/v1/hello":
                            data = {"message": "Hello from SAP AI Core"}
                        elif self.path == "/v1/health":
                            data = {"status": "healthy"}
                        else:
                            self.send_error(404)
                            return

                        body = json.dumps(data).encode("utf-8")
                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(body)))
                        self.end_headers()
                        self.wfile.write(body)

                print("Hello World API started", flush=True)
                HTTPServer(("0.0.0.0", 9001), Handler).serve_forever()
